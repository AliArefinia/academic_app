  flutter:
    sdk: flutter
  meta: ^1.9.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9
  go_router: ^13.0.0
  flutter_bloc: ^8.1.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  injectable: ^2.3.2
  get_it: ^7.6.4
  dio: ^5.4.0
  retrofit: ^4.0.3
  shimmer: ^3.0.0
  connectivity_plus: ^6.1.0
  share_plus: ^11.0.0
#  flutter_native_splash: ^2.4.5
  fluentui_system_icons: ^1.1.264
  flutter_html: ^3.0.0
  shared_preferences: ^2.3.3
  infinite_scroll_pagination: ^4.1.0
  flutter_screenutil: ^5.9.3
  flutter_form_builder:
  form_builder_validators:
  injectable_generator: ^2.4.1
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.2.0+3
  intl_phone_field: ^3.2.0
  carousel_slider:
  flutter_staggered_grid_view:
  smooth_sheets: ^0.9.4
  universal_image_flutter:
    path: packages/universal_image_package

#  cosmos_epub:
#    path: edited_packages/cosmos_epub-master
  #  story_widget:
  #    path: ../packages/Story_widget
  #  image_slider:
  #    path: ../packages/image_slider
  bounce: ^1.0.2
  pinput: ^5.0.0
  archive: ^3.4.10
  html: ^0.15.4

  lottie:
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_keyboard_visibility: ^6.0.0
  readmore: ^3.0.0
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  pretty_dio_logger: ^1.4.0
  auto_route: ^7.8.4
  just_audio: ^0.10.2
  equatable: ^2.0.7
  audio_session: ^0.1.18
  rxdart: ^0.27.7
  url_launcher: ^6.3.1
  app_links: ^3.5.0
  shamsi_date: ^1.0.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  file_picker: ^8.0.0
  flutter_launcher_icons: ^0.13.1
  syncfusion_flutter_pdfviewer: ^28.1.36

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ic_logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#3BA5B8"
  adaptive_icon_foreground: "assets/ic_logo.png"

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^2.0.0
  build_runner: ^2.4.7
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.6
  flutter_gen_runner: ^5.4.0
  go_router_builder:
  auto_route_generator: ^7.3.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  assets:
    - assets/

  fonts:
    - family: yakanBakh
      fonts:
        - asset: fonts/Yekan-Bakh-Regular.ttf
          weight: 300
        - asset: fonts/Yekan-Bakh-Medium.ttf
          weight: 500
        - asset: fonts/Yekan-Bakh-Bold.ttf
          weight: 700
        - asset: fonts/Yekan-Bakh-Black.ttf
          weight: 800
    - family: Vazirmatn
      fonts:
        - asset: fonts/Vazirmatn-Light.ttf
          weight: 300
    - family: Anjoman
      fonts:
        - asset: fonts/Anjoman-FaNum-Medium.ttf
          weight: 500
    - family: IRANYekanX
      fonts:
        - asset: fonts/IRANYekanX-Medium.ttf
          weight: 500
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

dependency_overrides:
  intl: ^0.20.2
